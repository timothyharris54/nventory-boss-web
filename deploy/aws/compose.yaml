name: nventory-boss

x-api-environment: &api-environment
  NODE_ENV: production
  PORT: 3000
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the deployment environment file}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the deployment environment file}
  APP_BASE_URL: ${APP_BASE_URL:?Set APP_BASE_URL in the deployment environment file}
  PASSWORD_RESET_URL_BASE: ${PASSWORD_RESET_URL_BASE:-}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
  EMAIL_FROM: ${EMAIL_FROM:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-}

services:
  migrate:
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY}/nventoryboss-api:${IMAGE_TAG:?Set IMAGE_TAG}
    environment: *api-environment
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    networks: [internal]

  api:
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY}/nventoryboss-api:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    environment: *api-environment
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks: [internal]

  web:
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY}/nventoryboss-web:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:3000
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks: [internal]

networks:
  internal:
    driver: bridge
